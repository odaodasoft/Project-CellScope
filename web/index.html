<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CellScope</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="hud-text"></div>
      <div style="margin-top: 8px;">
        Dataset: 
        <select id="datasetSelect">
          <option value="pca">PCA (2.6k)</option>
          <option value="synth_100k">Synthetic 100k</option>
          <option value="synth_500k">Synthetic 500k</option>
        </select>
        <button id="modeToggle" style="margin-left: 8px;">Switch to Spheres</button>
        <button id="toggleDotPlot" style="margin-left: 8px;">2D Dot Plot</button>
      </div>
      <div style="margin-top: 6px;">
        Color by: 
        <select id="colorModeSelect">
          <option value="cluster">Clusters</option>
          <option value="uncertainty">Uncertainty</option>
          <option value="gene">Gene Expression</option>
        </select>
        <select id="geneSelect" style="display:none; margin-left: 4px;"></select>
        <label style="margin-left: 8px; cursor: pointer; font-size: 12px;">
          <input type="checkbox" id="cvdToggle"> Simulate CVD
        </label>
      </div>
      <label style="display:block; margin-top:6px;">
        Size: <input type="range" id="sizeSlider" min="0.005" max="0.1" step="0.005" value="0.03">
      </label>
      <div id="legend" style="margin-top: 8px; font-size: 11px; line-height: 1.35;"></div>
    </div>
    <div id="dotplotPanel" style="display:none; position:fixed; right:12px; top:12px; background:#14161d; color:#eee; border:1px solid #444; border-radius:6px; padding:12px; z-index:20; max-height:90vh; overflow-y:auto; font-family:sans-serif; font-size:12px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <strong>Marker Expression by Cluster (T4)</strong>
        <button id="closeDotPlot" style="background:none; border:none; color:#aaa; cursor:pointer; font-size:14px;">✕</button>
      </div>
      <div id="dotplotContainer"></div>
      <div style="margin-top:8px; color:#aaa; font-size:11px;">
        Dot size = % expressing · Color = mean expression (Cividis)<br>
        <em>Click a cluster column to highlight in 3D · Click a gene row to view in 3D</em>
      </div>
    </div>
    <div id="tooltip"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
